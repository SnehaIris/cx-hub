<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f3edfb; --card-bg: #ffffff; --text: #251b3d; --text-muted: #7a6f96;
    --accent: #7c5cfc; --accent-soft: #e9e0ff; --border: #e2d6f7; --danger: #e0524d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; padding: 16px 20px 14px; background: var(--bg); border-bottom: 1px solid var(--border); z-index: 10; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 10px; }
  .brand-logo { height: 20px; width: auto; display: block; }
  .back-btn { background: none; border: none; color: var(--accent); font-size: 0.9rem; font-weight: 600; cursor: pointer; padding: 0; margin-top: 10px; }
  .editor-toggle { font-size: 0.78rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); cursor: pointer; }
  .editor-toggle.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 20px; padding-bottom: 180px; }

  .icon { font-size: 1.4rem; flex: none; }
  .icon-img { height: 1.3rem; width: 1.3rem; object-fit: contain; flex: none; }
  .drag-handle { color: var(--text-muted); cursor: grab; font-size: 1.1rem; padding: 2px 4px; flex: none; }
  .drag-handle:active { cursor: grabbing; }

  .cat-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
    cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .cat-card:hover { border-color: var(--accent); }
  .cat-card .label { font-size: 0.98rem; font-weight: 600; flex: 1; }
  .cat-card .chev { color: var(--text-muted); flex: none; }
  .cat-card.dragging { opacity: 0.4; }

  #cat-search { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text); font-size: 0.95rem; margin-bottom: 14px; }
  .product-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
  .product-tab { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
    font-size: 0.85rem; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .product-tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .product-tab.dragging { opacity: 0.4; }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; }
  .item-row.dragging { opacity: 0.4; }
  .item-row a.name { flex: 1; color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row a.name:hover { color: var(--accent); }
  .product-chip { font-size: 0.68rem; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; flex: none; }
  .count-badge { flex: none; min-width: 36px; text-align:center; font-size: 0.76rem; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 10px; padding: 3px 7px; }
  .del-btn { flex: none; width: 34px; height: 34px; border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text-muted); border-radius: 8px; cursor: pointer; }
  .del-btn:hover { color: var(--danger); border-color: var(--danger); }

  .empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.9rem; }

  .fab { position: fixed; right: 20px; bottom: 20px; background: var(--accent); color: white; border: none;
    border-radius: 999px; padding: 14px 20px; font-weight: 600; box-shadow: 0 6px 18px rgba(108,75,244,0.35); cursor: pointer; }
  .fab-pos-mid { bottom: 76px; }
  .fab-pos-top { bottom: 132px; }
  .fab-accent-outline { background: var(--card-bg); color: var(--accent); border: 1px solid var(--accent); box-shadow: none; }
  .fab-danger-outline { background: var(--card-bg); color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card-bg); width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 20px; border: 1px solid var(--border); border-bottom: none; }
  .modal h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.92rem; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--border); font-weight: 600; cursor: pointer;
    background: var(--card-bg); color: var(--text); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; }
</style>
</head>

<button class="fab fab-danger-outline" id="removed-btn" style="display:none">🗑️ Removed</button>

<!-- Add Link modal -->
<div class="modal-overlay" id="add-overlay">
  <div class="modal">
    <h2>Add a link</h2>
    <div class="field"><label>Name</label><input id="f-name" type="text" placeholder="e.g. New Chargeback Form"></div>
    <div class="field"><label>Link</label><input id="f-url" type="text" placeholder="https://…"></div>
    <div class="field" id="f-doctype-wrap" style="display:none">
      <label>Document type</label>
      <select id="f-doctype"></select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="add-cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="add-save-btn">Save</button>
    </div>
    <div class="hint" id="add-hint"></div>
  </div>
</div>

<!-- Activity Center -->
<div class="modal-overlay" id="activity-overlay">
  <div class="modal" style="max-width:600px">
    <h2>📊 Activity Center</h2>
    <div class="hint" style="margin-bottom:14px">Visible only to you and anyone with edit access.</div>
    <div id="activity-summary" style="display:flex; gap:16px; margin-bottom:18px;"></div>
    <canvas id="views-chart" height="140"></canvas>
    <div class="hint" style="margin-top:20px; font-weight:600; color:var(--text)">Link open counts</div>
    <div id="top-links" style="max-height:220px; overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn" id="activity-export-btn">⬇ Export CSV</button>
      <button class="btn" id="activity-close-btn">Close</button>
    </div>
  </div>
</div>

<!-- Removed Links -->
<div class="modal-overlay" id="removed-overlay">
  <div class="modal" style="max-width:600px">
    <h2>🗑️ Removed links</h2>
    <div class="hint" style="margin-bottom:14px">Visible only to you and anyone with edit access.</div>
    <div id="removed-links" style="max-height:400px; overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn" id="removed-close-btn">Close</button>
    </div>
  </div>
</div>

let DATA = { categoryOrder: [], docTypeOrder: {}, items: {} };
let editorMode = false;
let editPassword = sessionStorage.getItem('cxhub_pw') || null;
let view = 'home';
let selectedDocType = null;
let catSearch = '';
let linkCounts = {};
let dragSrc = null; // generic drag source index

const mainEl = document.getElementById('main');
const pageTitle = document.getElementById('page-title');
const backBtn = document.getElementById('back-btn');
const addBtn = document.getElementById('add-link-btn');
const activityBtn = document.getElementById('activity-btn');
const removedBtn = document.getElementById('removed-btn');
const editorToggle = document.getElementById('editor-toggle');
const addOverlay = document.getElementById('add-overlay');
const activityOverlay = document.getElementById('activity-overlay');
const removedOverlay = document.getElementById('removed-overlay');
let viewsChart = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function iconHtml(icon) {
  return icon.startsWith('data:image') ? `<img class="icon-img" src="${icon}" alt="">` : `<span class="icon">${icon}</span>`;
}
function trackKey(categoryId, docType, name) {
  const label = CATEGORY_META[categoryId].label;
  return docType ? `${label} / ${docType} — ${name}` : `${label} — ${name}`;
}
function getList(categoryId, docType) {
  if (CATEGORY_META[categoryId].flat) return DATA.items[categoryId] || [];
  return (DATA.items[categoryId] && DATA.items[categoryId][docType]) || [];
}

async function loadData() {
  const res = await fetch('/api/data');
  DATA = await res.json();
}

function categoryOrder() {
  return DATA.categoryOrder.length ? DATA.categoryOrder : Object.keys(CATEGORY_META);
}
function docTypeOrderFor(categoryId) {
  return (DATA.docTypeOrder && DATA.docTypeOrder[categoryId]) || DOC_TYPES;
}

// ---------- Rendering ----------
function renderHome() {
  pageTitle.textContent = 'CX Hub';
  backBtn.style.display = 'none';
  const order = categoryOrder();
  const cards = order.map((catId, idx) => {
    const meta = CATEGORY_META[catId];
    return `<div class="cat-card" draggable="${editorMode}" data-idx="${idx}" data-catid="${catId}">
      ${editorMode ? `<span class="drag-handle">⠿</span>` : ''}
      ${iconHtml(meta.icon)}
      <span class="label">${meta.label}</span>
      <span class="chev">›</span>
    </div>`;
  }).join('');
  mainEl.innerHTML = `<div class="cat-list">${cards}</div>`;

  mainEl.querySelectorAll('.cat-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (editorMode && e.target.classList.contains('drag-handle')) return;
      view = card.dataset.catid;
      selectedDocType = null;
      catSearch = '';
      render();
    });
    if (editorMode) {
      card.addEventListener('dragstart', () => { dragSrc = +card.dataset.idx; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', (e) => e.preventDefault());
      card.addEventListener('drop', async (e) => {
        e.preventDefault();
        const destIdx = +card.dataset.idx;
        if (dragSrc === null || dragSrc === destIdx) return;
        const order = categoryOrder().slice();
        const [moved] = order.splice(dragSrc, 1);
        order.splice(destIdx, 0, moved);
        dragSrc = null;
        await reorder('category', { order });
        render();
      });
    }
  });
}

function itemRowHtml(categoryId, docType, name, url, chip) {
  const key = trackKey(categoryId, docType, name);
  const count = linkCounts[key] || 0;
  return `<div class="item-row" draggable="${editorMode && !chip}" data-name="${escapeHtml(name)}">
    ${editorMode && !chip ? `<span class="drag-handle">⠿</span>` : ''}
    <a class="name" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"
       data-cat="${categoryId}" data-doctype="${docType || ''}" data-name="${escapeHtml(name)}">${escapeHtml(name)}</a>
    ${chip ? `<span class="product-chip">${escapeHtml(chip)}</span>` : ''}
    ${editorMode ? `<span class="count-badge" title="Times opened">${count}</span>` : ''}
    ${editorMode ? `<button class="del-btn" data-cat="${categoryId}" data-doctype="${docType || ''}" data-name="${escapeHtml(name)}">✕</button>` : ''}
  </div>`;
}

function wireItemRows(categoryId, docType) {
  mainEl.querySelectorAll('a.name').forEach(a => {
    a.addEventListener('click', () => {
      const key = trackKey(a.dataset.cat, a.dataset.doctype || null, a.dataset.name);
      fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'click', key }) }).catch(() => {});
      if (editorMode) { linkCounts[key] = (linkCounts[key] || 0) + 1; renderCurrentList(); }
    });
  });
  mainEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => removeLink(btn.dataset.cat, btn.dataset.doctype || null, btn.dataset.name));
  });
  if (editorMode) {
    mainEl.querySelectorAll('.item-row[draggable="true"]').forEach(row => {
      row.addEventListener('dragstart', () => { dragSrc = row.dataset.name; row.classList.add('dragging'); });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => e.preventDefault());
      row.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (dragSrc === null) return;
        const rows = [...mainEl.querySelectorAll('.item-row[draggable="true"]')];
        const order = rows.map(r => r.dataset.name);
        const srcIdx = order.indexOf(dragSrc);
        const destIdx = order.indexOf(row.dataset.name);
        if (srcIdx === destIdx) return;
        order.splice(destIdx, 0, order.splice(srcIdx, 1)[0]);
        dragSrc = null;
        await reorder('item', { categoryId, docType, order });
        renderCurrentList();
      });
    });
  }
}

let lastRenderedCatId = null;
function renderCurrentList() { if (lastRenderedCatId) renderCategory(lastRenderedCatId); }

function renderCategory(catId) {
  lastRenderedCatId = catId;
  const meta = CATEGORY_META[catId];
  pageTitle.textContent = meta.label;
  backBtn.style.display = 'block';

  const q = catSearch.trim().toLowerCase();
  const searching = q.length > 0;

  if (meta.flat) {
    const items = getList(catId, null);
    const filtered = searching ? items.filter(([name]) => name.toLowerCase().includes(q)) : items;
    const listHtml = filtered.length
      ? filtered.map(([name, url]) => itemRowHtml(catId, null, name, url, null)).join('')
      : `<div class="empty">${searching ? `No matches for "${q}".` : 'No links added here yet.'}</div>`;
    mainEl.innerHTML = `
      <input id="cat-search" type="text" placeholder="Search ${escapeHtml(meta.label)}…" value="${catSearch.replace(/"/g,'&quot;')}">
      <div class="item-list">${listHtml}</div>`;
    document.getElementById('cat-search').addEventListener('input', (e) => { catSearch = e.target.value; renderCurrentList(); });
    wireItemRows(catId, null);
    return;
  }

  const docTypes = docTypeOrderFor(catId);
  if (!selectedDocType || !docTypes.includes(selectedDocType)) selectedDocType = docTypes[0];

  const tabs = docTypes.map((dt, idx) => `
    <div class="product-tab ${!searching && selectedDocType === dt ? 'active' : ''}" draggable="${editorMode}" data-doctype="${escapeHtml(dt)}" data-idx="${idx}">
      ${editorMode ? `<span class="drag-handle">⠿</span>` : ''}<span>${escapeHtml(dt)}</span>
    </div>`).join('');

  let listHtml;
  if (searching) {
    const results = [];
    docTypes.forEach(dt => getList(catId, dt).forEach(([name, url]) => {
      if (name.toLowerCase().includes(q)) results.push([name, url, dt]);
    }));
    listHtml = results.length
      ? results.map(([name, url, dt]) => itemRowHtml(catId, dt, name, url, dt)).join('')
      : `<div class="empty">No matches for "${q}" across Forms, Trackers & Response Sheets, SOP's, or Doc's & Guides.</div>`;
  } else {
    const items = getList(catId, selectedDocType);
    listHtml = items.length
      ? items.map(([name, url]) => itemRowHtml(catId, selectedDocType, name, url, null)).join('')
      : `<div class="empty">No links added here yet.</div>`;
  }

  mainEl.innerHTML = `
    <input id="cat-search" type="text" placeholder="Search Forms, Trackers, SOP's, Guides…" value="${catSearch.replace(/"/g,'&quot;')}">
    <div class="product-tabs">${tabs}</div>
    <div class="item-list">${listHtml}</div>`;

  document.getElementById('cat-search').addEventListener('input', (e) => { catSearch = e.target.value; renderCurrentList(); });

  mainEl.querySelectorAll('.product-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
      if (editorMode && e.target.classList.contains('drag-handle')) return;
      selectedDocType = tab.dataset.doctype;
      catSearch = '';
      renderCurrentList();
    });
    if (editorMode) {
      tab.addEventListener('dragstart', () => { dragSrc = +tab.dataset.idx; tab.classList.add('dragging'); });
      tab.addEventListener('dragend', () => tab.classList.remove('dragging'));
      tab.addEventListener('dragover', (e) => e.preventDefault());
      tab.addEventListener('drop', async (e) => {
        e.preventDefault();
        const destIdx = +tab.dataset.idx;
        if (dragSrc === null || dragSrc === destIdx) return;
        const order = docTypeOrderFor(catId).slice();
        const [moved] = order.splice(dragSrc, 1);
        order.splice(destIdx, 0, moved);
        dragSrc = null;
        await reorder('docType', { categoryId: catId, order });
        renderCurrentList();
      });
    }
  });

  wireItemRows(catId, selectedDocType);
}

function render() {
  if (view === 'home') { lastRenderedCatId = null; renderHome(); }
  else renderCategory(view);
}

// ---------- Edit actions ----------
async function reorder(scope, payload) {
  await fetch('/api/reorder', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-edit-password': editPassword },
    body: JSON.stringify({ scope, ...payload })
  });
  await loadData();
}

async function removeLink(categoryId, docType, name) {
  const res = await fetch('/api/links', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'x-edit-password': editPassword },
    body: JSON.stringify({ categoryId, docType, name, categoryLabel: CATEGORY_META[categoryId].label })
  });
  if (res.status === 401) return handleAuthExpired();
  const result = await res.json();
  DATA = result.data ? { ...DATA, items: result.data.items } : DATA;
  renderCurrentList();
}

function handleAuthExpired() {
  alert('Edit access expired — please re-enter the password.');
  editPassword = null;
  editorMode = false;
  sessionStorage.removeItem('cxhub_pw');
  updateEditUI();
  render();
}

function updateEditUI() {
  addBtn.style.display = editorMode ? 'block' : 'none';
  activityBtn.style.display = editorMode ? 'block' : 'none';
  removedBtn.style.display = editorMode ? 'block' : 'none';
  editorToggle.textContent = editorMode ? '🔓 Editor mode' : '🔒 Viewer mode';
  editorToggle.classList.toggle('on', editorMode);
}

editorToggle.addEventListener('click', async () => {
  if (editorMode) {
    editorMode = false;
    updateEditUI();
    render();
    return;
  }
  if (!editPassword) {
    const pw = prompt('Enter the edit password:');
    if (!pw) return;
    const res = await fetch('/api/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
    const result = await res.json();
    if (!result.ok) { alert('Incorrect password.'); return; }
    editPassword = pw;
    sessionStorage.setItem('cxhub_pw', pw);
  }
  editorMode = true;
  updateEditUI();
  const stats = await fetchStats();
  if (stats) linkCounts = stats.linkClicks || {};
  render();
});

// ---------- Add link modal ----------
function openAddModal() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-url').value = '';
  document.getElementById('add-hint').textContent = '';
  const meta = CATEGORY_META[view] || CATEGORY_META['common-tools'];
  const wrap = document.getElementById('f-doctype-wrap');
  const select = document.getElementById('f-doctype');
  if (!meta.flat) {
    wrap.style.display = 'block';
    const docTypes = view !== 'home' ? docTypeOrderFor(view) : DOC_TYPES;
    select.innerHTML = docTypes.map(dt => `<option value="${escapeHtml(dt)}" ${dt === selectedDocType ? 'selected' : ''}>${escapeHtml(dt)}</option>`).join('');
  } else {
    wrap.style.display = 'none';
  }
  addOverlay.classList.add('open');
}
function closeAddModal() { addOverlay.classList.remove('open'); }

async function saveLink() {
  const name = document.getElementById('f-name').value.trim();
  const url = document.getElementById('f-url').value.trim();
  const hint = document.getElementById('add-hint');
  const categoryId = view !== 'home' ? view : 'common-tools';
  const meta = CATEGORY_META[categoryId];
  const docType = meta.flat ? null : document.getElementById('f-doctype').value;

  if (view === 'home') { hint.textContent = 'Open a category first, then add a link inside it.'; return; }
  if (!name || !url) { hint.textContent = 'Please fill in name and link.'; return; }
  if (!/^https?:\/\//i.test(url)) { hint.textContent = 'Link should start with http:// or https://'; return; }

  const res = await fetch('/api/links', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-edit-password': editPassword },
    body: JSON.stringify({ categoryId, docType, name, url })
  });
  if (res.status === 401) { closeAddModal(); return handleAuthExpired(); }
  const result = await res.json();
  DATA.items = result.data.items;
  closeAddModal();
  renderCurrentList();
}

// ---------- Activity Center ----------
async function fetchStats() {
  const res = await fetch('/api/stats', { headers: { 'x-edit-password': editPassword } });
  if (res.status === 401) { handleAuthExpired(); return null; }
  return res.json();
}

async function openActivityCenter() {
  const stats = await fetchStats();
  if (!stats) return;
  const totalViews = Object.values(stats.dailyViews || {}).reduce((a, b) => a + b, 0);
  const totalClicks = Object.values(stats.linkClicks || {}).reduce((a, b) => a + b, 0);
  const todayViews = (stats.dailyViews || {})[new Date().toISOString().slice(0, 10)] || 0;
  document.getElementById('activity-summary').innerHTML = `
    <div style="flex:1; text-align:center; padding:14px; background:var(--accent-soft); border-radius:10px;">
      <div style="font-size:1.6rem; font-weight:700; color:var(--accent)">${totalViews}</div>
      <div style="font-size:0.78rem; color:var(--text-muted)">Total views so far</div>
    </div>
    <div style="flex:1; text-align:center; padding:14px; background:var(--accent-soft); border-radius:10px;">
      <div style="font-size:1.6rem; font-weight:700; color:var(--accent)">${todayViews}</div>
      <div style="font-size:0.78rem; color:var(--text-muted)">Views today</div>
    </div>
    <div style="flex:1; text-align:center; padding:14px; background:var(--accent-soft); border-radius:10px;">
      <div style="font-size:1.6rem; font-weight:700; color:var(--accent)">${totalClicks}</div>
      <div style="font-size:0.78rem; color:var(--text-muted)">Total link opens</div>
    </div>`;

  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toISOString().slice(0, 10)); }
  const viewCounts = days.map(d => (stats.dailyViews || {})[d] || 0);
  const labels = days.map(d => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
  const ctx = document.getElementById('views-chart').getContext('2d');
  if (viewsChart) viewsChart.destroy();
  viewsChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Page views', data: viewCounts, backgroundColor: '#7c5cfc' }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });

  const topLinks = Object.entries(stats.linkClicks || {}).sort((a, b) => b[1] - a[1]);
  document.getElementById('top-links').innerHTML = topLinks.length
    ? topLinks.map(([key, count]) => `
        <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem;">
          <span>${escapeHtml(key)}</span><span style="color:var(--accent); font-weight:600">${count} open${count === 1 ? '' : 's'}</span>
        </div>`).join('')
    : `<div class="hint">No clicks recorded yet.</div>`;

  activityOverlay.classList.add('open');
}

function csvEscape(v) { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function downloadCsv(filename, text) {
  // Prepend a UTF-8 BOM so Excel reads the special characters (—, ', etc.) correctly
  // instead of flagging the file as corrupted/needing repair.
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportActivityCsv() {
  const stats = await fetchStats();
  if (!stats) return;
  let csv = 'Daily page views\nDate,Views\n';
  Object.entries(stats.dailyViews || {}).sort(([a],[b]) => a.localeCompare(b)).forEach(([d,c]) => csv += `${d},${c}\n`);
  csv += '\nLink open counts\nLink,Opens\n';
  Object.entries(stats.linkClicks || {}).sort((a,b) => b[1]-a[1]).forEach(([k,c]) => csv += `${csvEscape(k)},${c}\n`);
  csv += '\nRemoved links\nCategory,Doc Type,Name,URL,Removed At\n';
  (stats.deletedLinks || []).forEach(d => csv += `${csvEscape(d.categoryLabel)},${csvEscape(d.docType||'')},${csvEscape(d.name)},${csvEscape(d.url)},${d.deletedAt}\n`);
  downloadCsv(`cx-hub-activity-${new Date().toISOString().slice(0,10)}.csv`, csv);
}

async function openRemovedLinks() {
  const stats = await fetchStats();
  if (!stats) return;
  const deleted = stats.deletedLinks || [];
  document.getElementById('removed-links').innerHTML = deleted.length
    ? deleted.map(d => `
        <div style="padding:8px 0; border-bottom:1px solid var(--border); font-size:0.85rem;">
          <div style="font-weight:600">${escapeHtml(d.name)} <span style="font-weight:400; color:var(--text-muted)">(${escapeHtml(d.categoryLabel)}${d.docType ? ' / ' + escapeHtml(d.docType) : ''})</span></div>
          <div style="font-size:0.76rem; color:var(--text-muted); word-break:break-all;">${escapeHtml(d.url)}</div>
          <div style="font-size:0.72rem; color:var(--text-muted); margin-top:2px;">Removed ${new Date(d.deletedAt).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</div>
        </div>`).join('')
    : `<div class="hint">No links have been removed yet.</div>`;
  removedOverlay.classList.add('open');
}

// ---------- Wire up ----------
backBtn.addEventListener('click', () => { view = 'home'; selectedDocType = null; catSearch = ''; render(); });
addBtn.addEventListener('click', openAddModal);
document.getElementById('add-cancel-btn').addEventListener('click', closeAddModal);
document.getElementById('add-save-btn').addEventListener('click', saveLink);
addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) closeAddModal(); });

activityBtn.addEventListener('click', openActivityCenter);
document.getElementById('activity-close-btn').addEventListener('click', () => activityOverlay.classList.remove('open'));
document.getElementById('activity-export-btn').addEventListener('click', exportActivityCsv);
activityOverlay.addEventListener('click', (e) => { if (e.target === activityOverlay) activityOverlay.classList.remove('open'); });

removedBtn.addEventListener('click', openRemovedLinks);
document.getElementById('removed-close-btn').addEventListener('click', () => removedOverlay.classList.remove('open'));
removedOverlay.addEventListener('click', (e) => { if (e.target === removedOverlay) removedOverlay.classList.remove('open'); });

(async () => {
  await loadData();
  editorMode = false; // always start in viewer mode; toggle re-enables without re-prompting if a password is already stored
  updateEditUI();
  render();
  fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'pageview' }) }).catch(() => {});
})();
</script>
</body>
</html>
